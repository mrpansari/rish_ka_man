<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rishika &amp; Daaman Villa Allotment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shared room allotment for the groom's side at Ambli ni Pol, Surat: 23 villas, 69 rooms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: a "pol" (villa lanes) around the chowk (lawns), under a maroon bandhani band.
   Type: Rozha One (Indian display serif) for names of places, Mukta for everything you read and operate. */
:root{
  --paper:#FAF7F3; --paper-2:#F2EBE2; --paper-3:#E6DACB;
  --ink:#2B1A17; --ink-2:#6A524B; --ink-3:#97807A;
  --line:#E4D7C9; --card:#FFFFFF; --field:#FFFFFF;
  --accent:#7A1631; --accent-ink:#FFF4E6; --accent-text:#7A1631;
  --band:#6E1430; --band-ink:#FFF1E2; --band-ink-2:#F2C9B0; --band-dot:rgba(255,236,214,.16); --band-tab:rgba(255,241,226,.12); --gold:#E2B259;
  --mg1:#F2A007; --mg2:#E4572E;
  --hl:#FFF3D9; --hl-line:#EED29A; --sel:#F6D7A8;
  --ok-bg:#DCEFE2; --ok-fg:#245F3C; --mat-bg:#FBE3B7; --mat-fg:#7A4A00; --bad-bg:#F6D0CC; --bad-fg:#8C1D16; --info-bg:#E2E8F4; --info-fg:#2D3F6B;
  --bad:#B3261E; --warn:#B86E00; --badge-bg:#E7F0E2; --badge-fg:#3B6B2A;
  --h-wall:#FFFBF4; --h-roof:#E9D3AE; --h-base:#D9BF94; --h-stroke:#8C6B4F; --h-empty:#F3EADF; --hatch-a:#EADBC0; --hatch-b:#B9A07C; --ground:#4F7A1B;
  --lawn-1:#EAF1DA; --lawn-2:#D3E0B5; --lawn-line:#C3D29E; --lawn-ink:#3D5214; --lawn-ink-2:#4F6420; --lawn-base:#BCD08F; --pillar:#E9D3AE;
  --g-ghar:#7A1631; --g-dadihal:#B87309; --g-nanihal:#C2306A; --g-rishtedar:#0F6E6E; --g-mitra:#557A1A; --g-yaar:#36429A; --g-crew:#6F655C; --g-text:#FFFFFF;
  --shadow:0 1px 2px rgba(60,20,10,.06),0 10px 24px rgba(60,20,10,.08);
  --scrim:rgba(43,26,23,.45);
  --f-display:'Rozha One',Georgia,'Times New Roman',serif;
  --f-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171110; --paper-2:#211816; --paper-3:#30241F;
  --ink:#F4E9DD; --ink-2:#C6B1A5; --ink-3:#917B70;
  --line:#3A2C27; --card:#1F1715; --field:#271D1A;
  --accent:#A3264B; --accent-ink:#FFF1E6; --accent-text:#F2899F;
  --band:#3F0B1C; --band-ink:#FBEBDD; --band-ink-2:#DDAE93; --band-dot:rgba(255,226,200,.10); --band-tab:rgba(255,241,226,.10); --gold:#C79A45;
  --hl:#3A2A12; --hl-line:#6B5222; --sel:#5A3A1A;
  --ok-bg:#1F3A2A; --ok-fg:#9ED7B0; --mat-bg:#4A3510; --mat-fg:#F5C77A; --bad-bg:#4A1C18; --bad-fg:#F2A39B; --info-bg:#232C42; --info-fg:#AFC0EA;
  --bad:#F07467; --warn:#E8A33C; --badge-bg:#26341C; --badge-fg:#A9CF86;
  --h-wall:#2D2320; --h-roof:#5A4535; --h-base:#4A3A2E; --h-stroke:#A88B70; --h-empty:#3A2E29; --hatch-a:#3A2E29; --hatch-b:#6E5847; --ground:#9BC75A;
  --lawn-1:#22301A; --lawn-2:#1A2614; --lawn-line:#34482A; --lawn-ink:#C3DB97; --lawn-ink-2:#A5BD7C; --lawn-base:#2E4222; --pillar:#6B5440;
  --g-ghar:#D9667F; --g-dadihal:#E2A33C; --g-nanihal:#EC6AA0; --g-rishtedar:#3BB3AE; --g-mitra:#98C353; --g-yaar:#8E99EE; --g-crew:#AEA295; --g-text:#170F0D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171110; --paper-2:#211816; --paper-3:#30241F;
  --ink:#F4E9DD; --ink-2:#C6B1A5; --ink-3:#917B70;
  --line:#3A2C27; --card:#1F1715; --field:#271D1A;
  --accent:#A3264B; --accent-ink:#FFF1E6; --accent-text:#F2899F;
  --band:#3F0B1C; --band-ink:#FBEBDD; --band-ink-2:#DDAE93; --band-dot:rgba(255,226,200,.10); --band-tab:rgba(255,241,226,.10); --gold:#C79A45;
  --hl:#3A2A12; --hl-line:#6B5222; --sel:#5A3A1A;
  --ok-bg:#1F3A2A; --ok-fg:#9ED7B0; --mat-bg:#4A3510; --mat-fg:#F5C77A; --bad-bg:#4A1C18; --bad-fg:#F2A39B; --info-bg:#232C42; --info-fg:#AFC0EA;
  --bad:#F07467; --warn:#E8A33C; --badge-bg:#26341C; --badge-fg:#A9CF86;
  --h-wall:#2D2320; --h-roof:#5A4535; --h-base:#4A3A2E; --h-stroke:#A88B70; --h-empty:#3A2E29; --hatch-a:#3A2E29; --hatch-b:#6E5847; --ground:#9BC75A;
  --lawn-1:#22301A; --lawn-2:#1A2614; --lawn-line:#34482A; --lawn-ink:#C3DB97; --lawn-ink-2:#A5BD7C; --lawn-base:#2E4222; --pillar:#6B5440;
  --g-ghar:#D9667F; --g-dadihal:#E2A33C; --g-nanihal:#EC6AA0; --g-rishtedar:#3BB3AE; --g-mitra:#98C353; --g-yaar:#8E99EE; --g-crew:#AEA295; --g-text:#170F0D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{accent-color:var(--accent);caret-color:var(--accent-text);scrollbar-color:var(--paper-3) transparent}
::selection{background:var(--sel);color:var(--ink)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input:disabled,select:disabled{opacity:1;color:var(--ink);cursor:default;-webkit-text-fill-color:var(--ink)}
input[type=checkbox]:disabled{opacity:.55}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.gutter{padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}

/* header band */
.band{background:
  radial-gradient(circle at 12px 7px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 7px 12px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 17px 12px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 12px 17px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  var(--band);color:var(--band-ink);border-bottom:3px solid var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:16px;max-width:1500px;margin:0 auto}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mono{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px var(--band),inset 0 0 0 4px var(--gold);font:400 19px var(--f-display);color:var(--band-ink);white-space:nowrap}
.mono span{font-size:14px;margin:0 2px;color:var(--gold)}
.brand h1{font:400 30px/1 var(--f-display);color:var(--band-ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand p{margin:5px 0 0;color:var(--band-ink-2);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);color:var(--band-ink);background:var(--band-tab);border-radius:999px;padding:2px 10px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--band-ink-2)}
.status.live i{background:#8BD17C}
.tabs{display:flex;gap:2px;background:var(--band-tab);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--band-ink);min-height:38px}
.tabs button:hover{background:var(--band-tab)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--accent-text)}
.tabs button:focus-visible{outline-color:var(--gold)}

.wrap{padding-block:18px 48px;max-width:1500px;margin:0 auto}
/* summary ledger */
.ledger{display:grid;grid-template-columns:repeat(6,auto);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.ledger>*{background:var(--card);padding:10px 16px;min-width:0;text-align:left;border:0;font:inherit;color:inherit}
.ledger b{display:block;font-size:24px;line-height:1.1;font-weight:700}
.ledger b span{font-size:15px;font-weight:500;color:var(--ink-2)}
.ledger small{color:var(--ink-2);font-size:13px;line-height:1.3;display:block}
.ledger .nights{display:flex;gap:14px}
.ledger button{cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.ledger button:hover{background:var(--paper-2)}
.ledger button.alert b{color:var(--bad)}
.ledger button small{display:flex;align-items:center;gap:4px}
.banner{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hl);border:1px solid var(--hl-line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:15px}
.banner>span:first-child{min-width:0;flex:1 1 320px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;min-height:36px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--paper-2)}
.btn.small{padding:3px 10px;font-size:13.5px;min-height:30px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.itin{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-bottom:14px}
.itin div{padding:8px 16px 8px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.itin div+div{padding-left:16px;border-left:1px solid var(--line)}
.itin b{font-weight:700;color:var(--accent-text);white-space:nowrap}
.itin span{color:var(--ink-2);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px;font-size:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sep{width:1px;height:16px;background:var(--line)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.dot.res{background:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 5px)}
.dot.emp{background:var(--h-empty);border:1px solid var(--h-stroke)}
.sill{width:14px;height:3px;border-radius:2px;background:var(--ground);display:inline-block}

/* site map */
.site{display:grid;grid-template-columns:1fr minmax(220px,.62fr) 1fr;grid-template-areas:"z1 z1 z1" "z2 chowk z3" "z4 z4 z4";gap:14px}
.zone{background:var(--paper-2);border-radius:16px;padding:12px 12px 14px;min-width:0}
.zone .sign{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 4px 6px}
.zone .sign h2{font:400 21px var(--f-display);color:var(--accent-text)}
.zone .sign small{color:var(--ink-2);font-size:13.5px}
.lane{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.zone[data-z=z2] .lane,.zone[data-z=z3] .lane{grid-template-columns:repeat(2,1fr)}
.villa{background:transparent;border:1px solid transparent;border-radius:12px;padding:6px 4px 8px;text-align:center;transition:background .15s,border-color .15s,transform .15s;position:relative;min-width:0}
.villa:hover{background:var(--card);border-color:var(--line)}
.villa:active{transform:translateY(1px)}
.villa.active{background:var(--card);border-color:var(--accent-text)}
.villa svg{width:100%;max-width:128px;height:auto;display:block;margin:0 auto}
.villa .vl{font-weight:700;font-size:14.5px;margin-top:2px;line-height:1.2}
.villa .vm{font-size:13px;color:var(--ink-2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.villa .flag{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--paper-2)}
.villa .flag.warn{background:var(--warn)}
.hs{stroke:var(--h-stroke)} .h-roof{fill:var(--h-roof)} .h-wall{fill:var(--h-wall)} .h-base{fill:var(--h-base)} .h-empty{fill:var(--h-empty)}
.hatch-a{fill:var(--hatch-a)} .hatch-b{stroke:var(--hatch-b)} .h-ground{fill:var(--ground)} .mg1{fill:var(--mg1)} .mg2{fill:var(--mg2)}
.chowk{grid-area:chowk;border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  background:radial-gradient(circle at 50% 38%,var(--lawn-1) 0,var(--lawn-2) 100%);border:1px solid var(--lawn-line)}
.chowk h2{font:400 24px var(--f-display);color:var(--lawn-ink)}
.chowk p{margin:0;font-size:14px;color:var(--lawn-ink-2)}
.chowk svg{width:150px;max-width:100%;height:auto}
.note{font-size:13.5px;color:var(--ink-3);margin-top:12px}

/* allot board */
.board{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.side header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side header h2{font-size:19px}
.side .hint{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.side .list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.side .list.over{background:var(--hl)}
.field{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:7px 10px;width:100%;min-height:38px}
.hh{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.hh .hhh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14.5px;cursor:pointer;border-radius:6px}
.hh .hhh[draggable=true]{cursor:grab}
.hh .hhh>span{display:flex;align-items:center;gap:7px;min-width:0}
.hh .hhh small{font-weight:500;color:var(--ink-2);white-space:nowrap;font-size:13px}
.hh.sel{border-color:var(--accent-text);box-shadow:0 0 0 1px var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 7px;font-size:13.5px;user-select:none;line-height:1.6;max-width:100%;cursor:pointer}
.chip[draggable=true]{cursor:grab}
.chip:hover{border-color:var(--ink-3)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);background:var(--paper-2);border-radius:4px;padding:0 4px;line-height:1.5}
.chip.sel .tag{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.chip .x{border:0;background:transparent;padding:2px;margin:-2px -6px -2px 0;color:var(--ink-3);display:inline-flex;border-radius:50%}
.chip .x:hover{color:var(--bad);background:var(--paper-2)}
.chip .x .ic{width:13px;height:13px}
.chip.sel .x{color:var(--accent-ink)}
.mainb{min-width:0}
.mainb h2.zh{font:400 21px var(--f-display);margin:20px 0 8px;color:var(--accent-text)}
.mainb h2.zh:first-child{margin-top:0}
.mainb h2.zh small{font:500 14px var(--f-body);color:var(--ink-2);margin-left:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vcard>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}
.vcard>header b{font-size:15.5px}
.vcard>header small{color:var(--ink-2);font-size:13px;font-weight:500}
.slot{padding:8px 12px;border-top:1px dashed var(--line);min-height:56px;transition:background .12s}
.slot:first-of-type{border-top:0}
.slot.over,.placing .slot:not(.reserved):hover{background:var(--hl)}
.placing .slot:not(.reserved){cursor:copy}
.slot .sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-weight:600}
.slot.reserved{background:repeating-linear-gradient(135deg,var(--card) 0 8px,var(--paper-2) 8px 16px)}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;background:var(--badge-bg);color:var(--badge-fg);margin-left:6px;letter-spacing:.4px}
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{min-width:24px;height:16px;padding:0 3px;border-radius:4px;font-size:10.5px;line-height:16px;text-align:center;font-weight:700;background:var(--paper-2);color:var(--ink-3)}
.pip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pip.mat{background:var(--mat-bg);color:var(--mat-fg)}
.pip.bad{background:var(--bad-bg);color:var(--bad-fg)}
.placingbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 8px 8px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;box-shadow:var(--shadow)}

/* guest list */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:var(--paper)}
th{background:var(--paper-2);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
td input[type=text],td select{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:90px}
td input[type=text]:not(:disabled):hover,td select:not(:disabled):hover,td input[type=text]:focus,td select:focus{border-color:var(--line);background:var(--field);outline:none}
td input[type=checkbox]{width:17px;height:17px}
td.c{text-align:center}
tr.new td{background:var(--hl)}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

/* villa drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:20;overflow:auto;
  padding:calc(18px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 18px}
.drawer.open{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer h2{font:400 30px/1.1 var(--f-display);color:var(--accent-text)}

.empty h2{font:400 26px var(--f-display);color:var(--accent-text);margin-bottom:4px}

/* modal & toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--paper);padding:8px 10px 8px 16px;border-radius:10px;font-size:15px;transition:.2s cubic-bezier(.2,.8,.2,1);z-index:60;pointer-events:none;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

<script>
/* =====================================================================
   CONFIG: edit to match the real venue & families
   ===================================================================== */
const NIGHTS = [
  {label:'27 Feb', short:'27', sub:'Early arrivals'},
  {label:'28 Feb', short:'28', sub:'Haldi · Tilak · Sangeet'},
  {label:'1 Mar',  short:'1',  sub:'Mayra · Reception · Phere'},
];
const EVENTS = [
  {day:'Sun 28 Feb', items:'Haldi · Tilak · Sangeet'},
  {day:'Mon 1 Mar',  items:'Mayra · Reception · Phere, late night'},
  {day:'Tue 2 Mar',  items:'Vidai at dawn · Check-out'},
];
const GROUPS = [
  {id:'ghar',     name:'Ghar',           desc:"Groom's immediate family",           zones:['z1']},
  {id:'dadihal',  name:'Dadihal',        desc:'Paternal side: Tau, Chacha, Bua',    zones:['z2','z1','z3']},
  {id:'nanihal',  name:'Nanihal',        desc:'Maternal side: Mama, Mausi (Mayra)', zones:['z3','z1','z2']},
  {id:'rishtedar',name:'Rishtedar',      desc:'Extended relatives',                 zones:['z2','z3','z4']},
  {id:'mitra',    name:'Family friends', desc:"Parents' friends & neighbours",      zones:['z3','z2','z1']},
  {id:'yaar',     name:'Yaar-dost',      desc:"Daaman's friends",                   zones:['z4','z3']},
  {id:'crew',     name:'Crew',           desc:'Pandit ji, stylist, helpers',        zones:['z1','z4']},
].map(g=>({...g, color:`var(--g-${g.id})`}));
const ZONES = [
  {id:'z1', name:'Chowk Gali',  sub:'Nearest the lawns: Dulha villa, elders, crew', from:1,  to:6},
  {id:'z2', name:'Dadihal Pol', sub:'Paternal side',                                from:7,  to:12},
  {id:'z3', name:'Nanihal Pol', sub:'Maternal side, the Mayra party',               from:13, to:18},
  {id:'z4', name:'Masti Gali',  sub:'Far lane: friends and late nights',            from:19, to:23},
];
/* Example families by relation, loaded only by "Load example families".
   Member: "Name|flags|room"  flags e=elder k=kid · nights digits 0/1/2 = 27 Feb / 28 Feb / 1 Mar */
const EXAMPLES = [
  ['Dulha','ghar','012',['Daaman (Dulha)||V01-A']],
  ['Papa & Mummy','ghar','012',['Papa||V01-B','Mummy||V01-B']],
  ['Dada–Dadi','ghar','012',['Dadaji|e','Dadiji|e']],
  ['Bhaiya–Bhabhi','ghar','012',['Bhaiya','Bhabhi','Bhatija|k']],
  ['Didi–Jiju','ghar','012',['Didi','Jiju','Bhanji|k']],
  ['Nana–Nani','nanihal','12',['Nanaji|e','Naniji|e']],
  ['Bade Mama (Mayra)','nanihal','12',['Bade Mama','Badi Mami','Mama ka beta']],
  ['Chhote Mama','nanihal','12',['Chhote Mama','Chhoti Mami','Cousin (8)|k','Cousin (5)|k']],
  ['Badi Mausi','nanihal','12',['Badi Mausi','Mausa ji','Mausi ki beti']],
  ['Chhoti Mausi','nanihal','12',['Chhoti Mausi','Chhote Mausa ji','Cousin (6)|k']],
  ["Mummy's cousins",'nanihal','12',['Cousin Mama','Cousin Mami','Cousin bhai','Cousin behen']],
  ["Nani's brother",'nanihal','2',['Nani ke bhai|e','Unki patni|e']],
  ['Tau–Tai ji','dadihal','12',['Tauji','Taiji','Tauji ka beta']],
  ['Chacha–Chachi','dadihal','12',['Chachaji','Chachiji','Cousin (10)|k','Cousin (7)|k']],
  ['Bua–Fufa','dadihal','12',['Bua ji','Fufa ji','Bua ki beti','Cousin (4)|k']],
  ['Chhoti Bua','dadihal','12',['Chhoti Bua','Chhote Fufa ji']],
  ['Cousin bhaiya–bhabhi','dadihal','12',['Cousin bhaiya','Cousin bhabhi']],
  ["Papa's cousin",'dadihal','2',['Papa ke cousin','Unki patni','Unka beta']],
  ["Dadi's sister",'dadihal','12',["Dadi ki behen|e",'Unki beti']],
  ["Dada's brother",'dadihal','12',['Chhote Dadaji|e','Chhoti Dadiji|e']],
  ["Mummy's Mama ji",'rishtedar','2',['Mama ji','Mami ji','Unka beta']],
  ["Papa's Mausi",'rishtedar','2',['Mausi Dadi|e','Unke bete','Unki bahu']],
  ["Bhabhi's parents",'rishtedar','2',['Bhabhi ke papa','Bhabhi ki mummy']],
  ["Jiju's parents",'rishtedar','2',['Jiju ke papa','Jiju ki mummy']],
  ['Second cousins','rishtedar','12',['Second cousin 1','Second cousin 2','Second cousin 3','Second cousin 4']],
  ["Papa's business friend",'mitra','2',['Uncle','Aunty','Unki beti']],
  ["Papa's school friend",'mitra','2',['School-friend uncle','Aunty']],
  ["Mummy's kitty group",'mitra','2',['Kitty aunty 1','Kitty aunty 2','Kitty aunty 3']],
  ['Neighbours','mitra','12',['Padosi uncle','Padosi aunty']],
  ['School gang','yaar','12',['School friend 1','School friend 2','School friend 3','School friend 4','School friend 5']],
  ['College gang','yaar','012',['College friend 1','College friend 2','College friend 3','College friend 4','College friend 5','College friend 6']],
  ['Work friends','yaar','2',['Work friend 1','Work friend 2','Work friend 3','Work friend 4']],
  ['Best man & partner','yaar','012',['Best man','Partner']],
  ['Pandit ji','crew','2',['Pandit ji','Sahayak']],
  ["Groom's stylist",'crew','12',['Stylist','Stylist assistant']],
  ['Helpers & drivers','crew','12',['Helper 1','Helper 2','Driver']],
  ["Late RSVP: Papa's colleague",'mitra','2',['Colleague uncle','Colleague aunty'],true],
  ["Late RSVP: Didi's in-laws",'rishtedar','2',["Didi ke sasur ji|e","Didi ki saas ji|e",'Devar ji'],true],
  ['Plus-ones (TBC)','yaar','2',['Plus-one 1','Plus-one 2'],true],
];
const ROOM_CAP = 3, COMFY = 2.5, LS_KEY = 'rd-villa-allotment-v2';
const IN_VIEWER = !!(window.claude && typeof window.claude.use === 'function');

/* =====================================================================
   STATE
   ===================================================================== */
let seq = 0;
const uid = () => 'g' + Date.now().toString(36) + (seq++).toString(36).padStart(3,'0');
const UI = {tab:'map', sel:null, villa:null, q:'', gf:'all', showWarns:false, recent:[], canWrite:true, mode:'loading', note:'', canDL:!IN_VIEWER, loaded:false};
let DB = null, DL = null, UNDO = null;
const STORE = {g:new Map(), v:new Map()}, OVER = {g:new Map(), v:new Map()};
let BASE = {g:new Map(), v:new Map()};
let S = {villas:buildVillas(), guests:[]};

function buildVillas(){
  const v = [];
  for (const z of ZONES) for (let n = z.from; n <= z.to; n++){
    const id = 'V' + String(n).padStart(2,'0');
    v.push({id, label:'Villa ' + n, zone:z.id, note:'',
      rooms:['A','B','C'].map((r,i)=>({id:id+'-'+r, label:'Room '+r, ground:i===0, reserved:''}))});
  }
  v[0].note = 'Dulha villa'; v[0].rooms[2].reserved = "Dulha's getting-ready room";
  v[5].note = 'Help desk & store'; v[5].rooms[2].reserved = 'Store: gifts, Mayra & shagun saman';
  return v;
}
const ROOM_IDS = new Set(buildVillas().flatMap(v=>v.rooms.map(r=>r.id)));
const gdoc = g => ({name:g.name, hh:g.hh, group:g.group, elder:!!g.elder, kid:!!g.kid, nights:g.nights.map(Boolean), phone:g.phone||'', room:g.room||null, ex:!!g.ex, ord:g.ord||0});
const vdoc = v => ({label:v.label, zone:v.zone, note:v.note, rooms:v.rooms.map(r=>({ground:!!r.ground, reserved:r.reserved||''}))});
function normGuest(id, d){
  return {id, name:String(d.name||'Guest'), hh:String(d.hh||d.name||'Family'), group:GROUPS.some(g=>g.id===d.group)?d.group:'rishtedar',
    elder:!!d.elder, kid:!!d.kid, nights:[0,1,2].map(i=>Array.isArray(d.nights)?!!d.nights[i]:i>0), phone:String(d.phone||''),
    room:typeof d.room==='string' && ROOM_IDS.has(d.room) ? d.room : null, ex:!!d.ex, ord:Number(d.ord)||0};
}
function applyVilla(v, d){
  if (!d) return v;
  return {...v, label:String(d.label||v.label), zone:ZONES.some(z=>z.id===d.zone)?d.zone:v.zone, note:String(d.note??v.note),
    rooms:v.rooms.map((r,i)=>{ const x = Array.isArray(d.rooms) && d.rooms[i] || {}; return {...r, ground:'ground' in x ? !!x.ground : r.ground, reserved:'reserved' in x ? String(x.reserved||'') : r.reserved}; })};
}
function rebuild(){
  const gm = new Map(STORE.g); for (const [id,val] of OVER.g){ if (val===null) gm.delete(id); else gm.set(id,val); }
  S.guests = [...gm].map(([id,d])=>normGuest(id,d)).sort((a,b)=>a.ord-b.ord || (a.id<b.id?-1:1));
  const vm = new Map(STORE.v); for (const [id,val] of OVER.v) vm.set(id,val);
  S.villas = buildVillas().map(v=>applyVilla(v, vm.get(v.id)));
  snapshotBase();
}
function snapshotBase(){
  BASE = {g:new Map(S.guests.map(g=>[g.id, JSON.stringify(gdoc(g))])), v:new Map(S.villas.map(v=>[v.id, JSON.stringify(vdoc(v))]))};
}
/* Diff the working state against what was last stored, then persist only what changed. */
function commit(){
  if (!UI.canWrite){ toast('You can view this plan but not change it'); rebuild(); render(); return; }
  const changes = [], ids = new Set();
  for (const g of S.guests){ ids.add(g.id); const d = gdoc(g); if (BASE.g.get(g.id) !== JSON.stringify(d)) changes.push(['g', g.id, d]); }
  for (const id of BASE.g.keys()) if (!ids.has(id)) changes.push(['g', id, null]);
  for (const v of S.villas){ const d = vdoc(v); if (BASE.v.get(v.id) !== JSON.stringify(d)) changes.push(['v', v.id, d]); }
  snapshotBase(); persist(changes); render();
}
function checkpoint(){ UNDO = {guests:S.guests.map(g=>({...g, nights:[...g.nights]})), villas:JSON.parse(JSON.stringify(S.villas))}; }
function undo(){ if (!UNDO) return; S.guests = UNDO.guests; S.villas = UNDO.villas; UNDO = null; commit(); toast('Undone'); }
/* ---- write queue: one write at a time per document, a few in flight overall ---- */
const WQ = {chains:new Map(), active:0, waiting:[]};
const slot = () => new Promise(r=>{ if (WQ.active < 6){ WQ.active++; r(); } else WQ.waiting.push(r); });
const release = () => { const n = WQ.waiting.shift(); if (n) n(); else WQ.active--; };
async function withRetry(fn){ try{ return await fn(); }catch(e){ if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 300+Math.random()*700)); return fn(); } throw e; } }
function write(path, fn){
  const p = (WQ.chains.get(path) || Promise.resolve()).then(async()=>{ await slot(); try{ return await withRetry(fn); } finally{ release(); } });
  WQ.chains.set(path, p.catch(()=>{})); return p;
}
let writeErrShown = false;
function persist(changes){
  if (UI.mode === 'shared'){
    for (const [k,id,val] of changes){
      const path = (k==='g' ? 'guests/' : 'villas/') + id;
      OVER[k].set(id, val);
      write(path, ()=> val===null ? DB.doc(path).delete() : DB.doc(path).set(val))
        .then(()=>{ if (OVER[k].get(id)===val) OVER[k].delete(id); })
        .catch(e=>{
          OVER[k].delete(id);
          if (!writeErrShown){ writeErrShown = true; setTimeout(()=>writeErrShown=false, 4000);
            if (e && e.code==='invalid_argument'){ UI.canWrite = false; toast('This plan is view-only for you, so that change was not saved'); }
            else if (e && e.code==='quota_exceeded') toast('The shared plan is full. Remove some guests, then try again.');
            else toast('A change could not be saved. Check your connection and try again.'); }
          rebuild(); render();
        });
    }
  } else if (UI.mode === 'local'){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({guests:S.guests.map(g=>({id:g.id, ...gdoc(g)})), villas:S.villas.map(v=>({id:v.id, ...vdoc(v)}))})); }catch(e){}
  }
}
function loadLocal(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && Array.isArray(d.guests)){
    STORE.g = new Map(d.guests.map(g=>[g.id, g])); STORE.v = new Map((d.villas||[]).map(v=>[v.id, v])); return true; } }catch(e){}
  return false;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls='') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const grp = id => GROUPS.find(g=>g.id===id) || GROUPS[0];
const zone = id => ZONES.find(z=>z.id===id);
const villaById = id => S.villas.find(v=>v.id===id);
const villaOf = roomId => roomId ? villaById(roomId.slice(0,3)) : null;
const roomById = roomId => { const v = villaOf(roomId); return v && v.rooms.find(r=>r.id===roomId); };
const guest = id => S.guests.find(g=>g.id===id);
const units = g => g.kid ? 0.5 : 1;
const occ = roomId => S.guests.filter(g=>g.room===roomId);
const loadN = (roomId,n) => occ(roomId).filter(g=>g.nights[n]).reduce((a,g)=>a+units(g),0);
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

function ask(title, body, buttons){
  return new Promise(res=>{
    const m = $('#modal'); $('#mtitle').textContent = title; $('#mbody').textContent = body;
    const all = [...buttons, {label:'Cancel', value:null, cls:'ghost'}];
    $('#mbtns').innerHTML = all.map((b,i)=>`<button class="btn ${b.cls||''}" data-mi="${i}">${esc(b.label)}</button>`).join('');
    m.hidden = false; $('#mbtns [data-mi="0"]').focus();
    const done = v => { m.hidden = true; m.onclick = null; document.removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key==='Escape'){ e.stopPropagation(); done(null); } };
    document.addEventListener('keydown', key, true);
    m.onclick = e => { const b = e.target.closest('[data-mi]'); if (b) done(all[+b.dataset.mi].value); else if (e.target===m) done(null); };
  });
}

/* =====================================================================
   SUGGEST ROOMS: families together, each group in its lane,
   elders on the ground floor near the lawns
   ===================================================================== */
function chunkHousehold(ms){
  const adults = ms.filter(g=>!g.kid), kids = ms.filter(g=>g.kid);
  const sum = c => c.reduce((a,g)=>a+units(g),0);
  if (sum(ms) <= ROOM_CAP) return [ms.slice()];
  const chunks = []; let i = 0;
  while (i < adults.length){ const rem = adults.length-i; const take = rem===3 && !kids.length ? 3 : Math.min(2, rem); chunks.push(adults.slice(i, i+take)); i += take; }
  if (!chunks.length) chunks.push([]);
  for (const k of kids){ let c = chunks.find(c=>sum(c)+0.5 <= ROOM_CAP); if (!c){ c = []; chunks.push(c); } c.push(k); }
  return chunks;
}
const freeRooms = v => v.rooms.filter(r=>!r.reserved && occ(r.id).length===0);
function autoAssign(filter = () => true){
  const hhs = households().map(h=>({...h, todo:h.members.filter(g=>!g.room && filter(g))})).filter(h=>h.todo.length);
  const rank = h => h.group==='ghar' ? 0 : h.todo.some(g=>g.elder) ? 1 : h.group==='crew' ? 2 : 3 + GROUPS.findIndex(g=>g.id===h.group);
  hhs.sort((a,b)=>rank(a)-rank(b) || b.todo.length-a.todo.length);
  let left = 0;
  for (const h of hhs){
    const chunks = chunkHousehold(h.todo), elderChunks = chunks.filter(c=>c.some(g=>g.elder)).length;
    const zones = [...(elderChunks ? ['z1'] : []), ...grp(h.group).zones, ...ZONES.map(z=>z.id)].filter((z,i,a)=>a.indexOf(z)===i);
    const score = v => { const gs = v.rooms.flatMap(r=>occ(r.id)).map(g=>g.group); return gs.includes(h.group) ? 2 : gs.length ? 0 : 1; };
    let target = null;
    for (const z of zones){
      const c = S.villas.filter(v=>v.zone===z).filter(v=>{ const fr = freeRooms(v); return fr.length >= chunks.length && fr.filter(r=>r.ground).length >= elderChunks; }).sort((a,b)=>score(b)-score(a));
      if (c.length){ target = c[0]; break; }
    }
    if (target){
      const fr = freeRooms(target);
      chunks.sort((a,b)=>b.some(g=>g.elder)-a.some(g=>g.elder)).forEach(c=>{
        const isE = c.some(g=>g.elder); const r = fr.find(r=>r.ground===isE) || fr[0];
        fr.splice(fr.indexOf(r),1); c.forEach(g=>g.room=r.id); });
    } else {
      for (const c of chunks){
        let r = null;
        for (const z of zones){ for (const v of S.villas.filter(v=>v.zone===z)){ r = freeRooms(v)[0]; if (r) break; } if (r) break; }
        if (r) c.forEach(g=>g.room=r.id); else left += c.length;
      }
    }
  }
  return left;
}
function exampleGuests(){
  const out = []; let ord = 1;
  for (const [hh, group, nights, members, hold] of EXAMPLES) for (const m of members){
    const [name, flags='', pin=''] = m.split('|');
    out.push({id:'ex' + String(ord).padStart(3,'0'), name, hh, group, elder:flags.includes('e'), kid:flags.includes('k'),
      nights:[0,1,2].map(i=>nights.includes(String(i))), phone:'', room:pin||null, ex:true, ord:ord++, hold:!!hold});
  }
  return out;
}
function loadExamples(){
  const ex = exampleGuests(); const ids = new Set(S.guests.map(g=>g.id));
  S.guests = S.guests.concat(ex.filter(g=>!ids.has(g.id)));
  autoAssign(g => g.ex && !g.hold); S.guests.forEach(g=>delete g.hold);
}

/* =====================================================================
   CHECKS
   ===================================================================== */
function warnings(){
  const W = [];
  for (const v of S.villas) for (const r of v.rooms){
    const o = occ(r.id); if (!o.length) continue;
    if (r.reserved) W.push({lvl:'bad', v:v.id, t:`${v.label} · ${r.label} is reserved (${r.reserved}) but has guests`});
    const worst = Math.max(...NIGHTS.map((_,n)=>loadN(r.id,n)));
    if (worst > ROOM_CAP) W.push({lvl:'bad', v:v.id, t:`${v.label} · ${r.label} needs ${fmt(worst)} beds on its busiest night; it holds ${ROOM_CAP}`});
    o.filter(g=>g.elder && !r.ground).forEach(g=>W.push({lvl:'warn', v:v.id, t:`${g.name} is an elder in ${v.label} · ${r.label}, which is upstairs`}));
  }
  for (const h of households()){
    const placed = h.members.filter(g=>g.room);
    const vs = [...new Set(placed.map(g=>villaOf(g.room).id))];
    if (vs.length > 1) W.push({lvl:'info', v:vs[0], t:`${h.name} is split across ${vs.map(id=>villaById(id).label).join(' & ')}`});
    placed.filter(g=>g.kid).forEach(k=>{ const vid = villaOf(k.room).id;
      if (!placed.some(a=>!a.kid && villaOf(a.room).id===vid)) W.push({lvl:'warn', v:vid, t:`${k.name} (${h.name}) has no grown-up from the family in ${villaById(vid).label}`}); });
  }
  const o = ['bad','warn','info']; return W.sort((a,b)=>o.indexOf(a.lvl)-o.indexOf(b.lvl));
}

function placeSelection(sel, roomId){
  if (!UI.canWrite) return;
  const r = roomById(roomId); if (!r || r.reserved){ toast('That room is held for something else'); return; }
  if (sel.type==='g'){ const g = guest(sel.id); if (g){ g.room = roomId; toast(`${g.name} is in ${villaOf(roomId).label}, ${r.label}`); } }
  else {
    const h = households().find(h=>h.name===sel.id); if (!h) return;
    const ms = h.members.filter(g=>!g.room), pool = ms.length ? ms : h.members, v = villaOf(roomId);
    const others = v.rooms.filter(x=>x.id!==roomId && !x.reserved && !occ(x.id).some(g=>!pool.includes(g)));
    let left = 0; pool.forEach(g=>g.room=null);
    chunkHousehold(pool).forEach((c,i)=>{ const t = i===0 ? r : others.shift(); if (t) c.forEach(g=>g.room=t.id); else left += c.length; });
    toast(left ? `${v.label} is full: ${left} from ${h.name} still need a room` : `${h.name} is in ${v.label}`);
  }
  UI.sel = null; commit();
}
const csvCell = s => /[",\n]/.test(String(s)) ? `"${String(s).replace(/"/g,'""')}"` : String(s);
function exportCSV(){
  const rows = [['name','household','group','elder','kid','nights','phone','villa','room','room_id']];
  for (const g of S.guests){ const v = villaOf(g.room), r = roomById(g.room);
    rows.push([g.name,g.hh,grp(g.group).name,g.elder?'yes':'',g.kid?'yes':'',NIGHTS.filter((_,n)=>g.nights[n]).map(n=>n.short).join(' '),g.phone,v?v.label:'',r?r.label:'',g.room||'']); }
  saveFile('villa-allotment.csv', rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}
function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importCSV(text){
  const rows = parseCSV(text.replace(/^﻿/,'')); if (rows.length < 2){ toast('That CSV has a header but no guests'); return; }
  const H = rows[0].map(h=>h.trim().toLowerCase()), col = k => H.indexOf(k);
  if (col('name') < 0){ toast('The CSV needs a "name" column. The template shows the layout.'); return; }
  const yes = s => /^(y|yes|1|true|x|haan)$/i.test(String(s||'').trim());
  const findGroup = s => { s = String(s||'').trim().toLowerCase(); return (GROUPS.find(g=>g.id===s||g.name.toLowerCase()===s) || GROUPS.find(g=>s && g.name.toLowerCase().includes(s)) || {id:'rishtedar'}).id; };
  const parseNights = s => { s = String(s||'').toLowerCase(); if (!s.trim()) return [false,true,true]; return [/27/.test(s), /28/.test(s), /(^|\D)1(\D|$)|mar/.test(s)]; };
  let ord = Date.now();
  const list = rows.slice(1).map(r=>{ const get = k => col(k)>=0 ? (r[col(k)]||'') : ''; const name = get('name').trim(); if (!name) return null;
    const rid = get('room_id').trim().toUpperCase();
    return {id:uid(), name, hh:get('household').trim()||name, group:findGroup(get('group')), elder:yes(get('elder')), kid:yes(get('kid')),
      nights:parseNights(get('nights')), phone:get('phone').trim(), room:ROOM_IDS.has(rid)?rid:null, ex:false, ord:ord++}; }).filter(Boolean);
  if (!list.length){ toast('No names found in that CSV'); return; }
  let mode = 'add';
  if (S.guests.length) mode = await ask(`Import ${list.length} guests`, `The plan already has ${S.guests.length} guests. Add these to the list, or replace everyone?`,
    [{label:'Add to list', value:'add', cls:'primary'}, {label:'Replace everyone', value:'replace', cls:'danger'}]);
  if (!mode) return;
  checkpoint();
  S.guests = mode==='replace' ? list : S.guests.concat(list);
  UI.tab = 'allot'; location.hash = 'allot'; commit(); undoToast(`Imported ${list.length} guests`);
}
function templateCSV(){
  saveFile('guest-list-template.csv', ['name,household,group,elder,kid,nights,phone,room_id',
    'Dadaji,Dada–Dadi,Ghar,yes,,27 28 1,,','Dadiji,Dada–Dadi,Ghar,yes,,27 28 1,,',
    'Bade Mama,Bade Mama (Mayra),Nanihal,,,28 1,,','Cousin (8),Chhote Mama,Nanihal,,yes,28 1,,',
    'College friend 1,College gang,Yaar-dost,,,27 28 1,,'].join('\n'));
}
async function restoreJSON(txt){
  let d; try{ d = JSON.parse(txt); if (!Array.isArray(d.guests)) throw 0; }catch(_){ toast('That file is not a backup from this planner'); return; }
  const ok = await ask('Restore this backup?', `The plan is replaced by the backup's ${d.guests.length} guests and villa settings.`, [{label:'Restore', value:true, cls:'danger'}]);
  if (!ok) return;
  checkpoint();
  S.guests = d.guests.map(g=>normGuest(g.id || uid(), g));
  if (Array.isArray(d.villas)) S.villas = buildVillas().map(v=>applyVilla(v, d.villas.find(x=>x.id===v.id)));
  commit(); undoToast('Backup restored');
}

/* ---- events ---- */

  if (act){ const a = act.dataset.act;
    if (a==='close'){ UI.villa = null; render(); }
    if (a==='toggle-warns'){ UI.showWarns = !UI.showWarns; render(); }

    if (a==='clear'){ checkpoint(); S.guests.forEach(g=>g.room=null); commit(); undoToast('All rooms cleared'); }
    if (a==='cancel-sel'){ UI.sel = null; render(); }
    if (a==='load-examples'){ checkpoint(); loadExamples(); commit(); undoToast('Example families loaded'); }
    if (a==='remove-examples'){ checkpoint(); const n = S.guests.filter(g=>g.ex).length; S.guests = S.guests.filter(g=>!g.ex); commit(); undoToast(`Removed ${n} example guests`); }
    if (a==='template') templateCSV();
    if (a==='import-csv') $('#fileCsv').click();
    if (a==='import-json') $('#fileJson').click();
    if (a==='export-csv') exportCSV();
    if (a==='export-json') saveFile('villa-allotment-backup.json', JSON.stringify({guests:S.guests.map(g=>({id:g.id, ...gdoc(g)})), villas:S.villas.map(v=>({id:v.id, ...vdoc(v)}))}, null, 1));

    if (a==='add-guest'){ const g = {id:uid(), name:'New guest', hh:'New family', group:UI.gf!=='all'?UI.gf:'rishtedar', elder:false, kid:false, nights:[false,true,true], phone:'', room:null, ex:false, ord:Date.now()};
      S.guests.push(g); UI.recent.unshift(g.id); commit(); const i = document.getElementById('n-'+g.id); if (i){ i.focus(); i.select(); } }

  const open = t.closest('[data-open]'); if (open && open.dataset.open){ UI.villa = open.dataset.open; render(); return; }

  if ((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role=button][tabindex="0"]')){ e.preventDefault(); keyMode = true; e.target.click(); }
});

document.addEventListener('change', e=>{
  const t = e.target, d = t.dataset;
  if (d.k==='gf'){ UI.gf = t.value; render(); return; }
  if (d.ge){ const g = guest(d.id); if (!g) return;
    if (d.ge==='night') g.nights[+d.n] = t.checked;
    else if (d.ge==='elder'||d.ge==='kid') g[d.ge] = t.checked;
    else if (d.ge==='room') g.room = t.value || null;
    else if (d.ge==='phone') g.phone = t.value.trim();
    else g[d.ge] = t.value.trim() || g[d.ge];
    if (d.ge==='name' || d.ge==='hh') g.ex = false;
    commit(); return; }
  if (d.ve){ const v = villaById(UI.villa); v[d.ve] = t.value.trim() || (d.ve==='note' ? '' : v[d.ve]); commit(); return; }
  if (d.re){ const r = roomById(d.r); r[d.re] = d.re==='ground' ? t.checked : t.value.trim(); commit(); return; }
  if (d.addto && t.value){ const g = guest(t.value); if (g){ g.room = d.addto; commit(); } return; }

  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !UI.canWrite) return; e.preventDefault();
  let sel; try{ sel = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
  if (z.dataset.drop==='unassign'){
    if (sel.type==='g'){ const g = guest(sel.id); if (g) g.room = null; } else households().find(h=>h.name===sel.id)?.members.forEach(g=>g.room=null);
    commit(); return; }
  placeSelection(sel, z.dataset.drop);
});
const readFile = (input, fn) => input.addEventListener('change', ()=>{ const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = ()=>{ input.value = ''; fn(String(r.result)); }; r.readAsText(f); });
readFile($('#fileCsv'), importCSV);
readFile($('#fileJson'), restoreJSON);
window.addEventListener('hashchange', ()=>setTab(location.hash.slice(1)));

/* =====================================================================
   BOOT: the shared database when opened as a published page,
   this browser's storage when opened as a file
   ===================================================================== */
function startLocal(note){
  UI.mode = 'local'; UI.note = note || ''; UI.loaded = true;
  if (!loadLocal() && !IN_VIEWER){ rebuild(); loadExamples(); commit(); return; }
  rebuild(); render();
}
async function boot(){
  UI.tab = ['map','allot','guests','cards'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'map';
  render();
  if (!IN_VIEWER){ startLocal(); return; }
  let db = null, user = null;
  try{ [db, user, DL] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); }catch(e){}
  UI.canDL = !!DL;
  if (!db){ startLocal('Sign in to see the family’s shared plan. Changes made here stay in this browser only.'); return; }
  DB = db; UI.mode = 'shared';
  try{ const w = user ? await user.can('data.write') : null; UI.canWrite = w !== false; }catch(e){}
  const got = {g:false, v:false};
  const timer = setTimeout(()=>{ if (!UI.loaded){ UI.note = 'The shared plan can’t be reached right now. It appears as soon as the connection is back.'; render(); } }, 10000);
  const ready = (k, snap) => { if (!snap.metadata.fromCache) got[k] = true;
    if (got.g && got.v && !UI.loaded){ UI.loaded = true; clearTimeout(timer); if (UI.note.startsWith('The shared plan')) UI.note = ''; } };
  const fail = e => { clearTimeout(timer); UI.loaded = true; UI.note = e && e.code==='revoked' ? 'This plan is no longer shared with you.' : 'The live link to the shared plan dropped. Reload the page to reconnect.'; render(); };
  DB.collection('guests').onSnapshot(snap=>{ STORE.g = new Map(snap.docs.map(d=>[d.id, d.data()])); ready('g', snap); refreshFromStore(); }, fail);
  DB.collection('villas').onSnapshot(snap=>{ STORE.v = new Map(snap.docs.map(d=>[d.id, d.data()])); ready('v', snap); refreshFromStore(); }, fail);
}
boot();
</script>
