<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rishika &amp; Daaman Villa Allotment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shared room allotment for the groom's side at Ambli ni Pol, Surat: 23 villas, 69 rooms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: a "pol" (villa lanes) around the chowk (lawns), under a maroon bandhani band.
   Type: Rozha One (Indian display serif) for names of places, Mukta for everything you read and operate. */
:root{
  --paper:#FAF7F3; --paper-2:#F2EBE2; --paper-3:#E6DACB;
  --ink:#2B1A17; --ink-2:#6A524B; --ink-3:#7A665F;
  --line:#E4D7C9; --card:#FFFFFF; --field:#FFFFFF;
  --accent:#7A1631; --accent-ink:#FFF4E6; --accent-text:#7A1631;
  --band:#6E1430; --band-ink:#FFF1E2; --band-ink-2:#F2C9B0; --band-dot:rgba(255,236,214,.16); --band-tab:rgba(255,241,226,.12); --gold:#E2B259;
  --mg1:#F2A007; --mg2:#E4572E;
  --hl:#FFF3D9; --hl-line:#EED29A; --sel:#F6D7A8;
  --ok-bg:#DCEFE2; --ok-fg:#245F3C; --mat-bg:#FBE3B7; --mat-fg:#7A4A00; --bad-bg:#F6D0CC; --bad-fg:#8C1D16; --info-bg:#E2E8F4; --info-fg:#2D3F6B;
  --bad:#B3261E; --warn:#B86E00; --badge-bg:#E7F0E2; --badge-fg:#3B6B2A;
  --h-wall:#FFFBF4; --h-roof:#E9D3AE; --h-base:#D9BF94; --h-stroke:#8C6B4F; --h-empty:#F3EADF; --hatch-a:#EADBC0; --hatch-b:#B9A07C; --ground:#4F7A1B;
  --lawn-1:#EAF1DA; --lawn-2:#D3E0B5; --lawn-line:#C3D29E; --lawn-ink:#3D5214; --lawn-ink-2:#4F6420; --lawn-base:#BCD08F; --pillar:#E9D3AE;
  --g-ghar:#7A1631; --g-bhai:#B87309; --g-behn:#C2306A; --g-mama:#0F6E6E; --g-rishtedar:#6B4FA0; --g-mitra:#557A1A; --g-yaar:#36429A; --g-crew:#6F655C; --g-text:#FFFFFF;
  --shadow:0 1px 2px rgba(60,20,10,.06),0 10px 24px rgba(60,20,10,.08);
  --scrim:rgba(43,26,23,.45);
  --f-display:'Rozha One',Georgia,'Times New Roman',serif;
  --f-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171110; --paper-2:#211816; --paper-3:#30241F;
  --ink:#F4E9DD; --ink-2:#C6B1A5; --ink-3:#A8948A;
  --line:#3A2C27; --card:#1F1715; --field:#271D1A;
  --accent:#A3264B; --accent-ink:#FFF1E6; --accent-text:#F2899F;
  --band:#3F0B1C; --band-ink:#FBEBDD; --band-ink-2:#DDAE93; --band-dot:rgba(255,226,200,.10); --band-tab:rgba(255,241,226,.10); --gold:#C79A45;
  --hl:#3A2A12; --hl-line:#6B5222; --sel:#5A3A1A;
  --ok-bg:#1F3A2A; --ok-fg:#9ED7B0; --mat-bg:#4A3510; --mat-fg:#F5C77A; --bad-bg:#4A1C18; --bad-fg:#F2A39B; --info-bg:#232C42; --info-fg:#AFC0EA;
  --bad:#F07467; --warn:#E8A33C; --badge-bg:#26341C; --badge-fg:#A9CF86;
  --h-wall:#2D2320; --h-roof:#5A4535; --h-base:#4A3A2E; --h-stroke:#A88B70; --h-empty:#3A2E29; --hatch-a:#3A2E29; --hatch-b:#6E5847; --ground:#9BC75A;
  --lawn-1:#22301A; --lawn-2:#1A2614; --lawn-line:#34482A; --lawn-ink:#C3DB97; --lawn-ink-2:#A5BD7C; --lawn-base:#2E4222; --pillar:#6B5440;
  --g-ghar:#D9667F; --g-bhai:#E2A33C; --g-behn:#EC6AA0; --g-mama:#3BB3AE; --g-rishtedar:#B39BEA; --g-mitra:#98C353; --g-yaar:#8E99EE; --g-crew:#AEA295; --g-text:#170F0D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171110; --paper-2:#211816; --paper-3:#30241F;
  --ink:#F4E9DD; --ink-2:#C6B1A5; --ink-3:#A8948A;
  --line:#3A2C27; --card:#1F1715; --field:#271D1A;
  --accent:#A3264B; --accent-ink:#FFF1E6; --accent-text:#F2899F;
  --band:#3F0B1C; --band-ink:#FBEBDD; --band-ink-2:#DDAE93; --band-dot:rgba(255,226,200,.10); --band-tab:rgba(255,241,226,.10); --gold:#C79A45;
  --hl:#3A2A12; --hl-line:#6B5222; --sel:#5A3A1A;
  --ok-bg:#1F3A2A; --ok-fg:#9ED7B0; --mat-bg:#4A3510; --mat-fg:#F5C77A; --bad-bg:#4A1C18; --bad-fg:#F2A39B; --info-bg:#232C42; --info-fg:#AFC0EA;
  --bad:#F07467; --warn:#E8A33C; --badge-bg:#26341C; --badge-fg:#A9CF86;
  --h-wall:#2D2320; --h-roof:#5A4535; --h-base:#4A3A2E; --h-stroke:#A88B70; --h-empty:#3A2E29; --hatch-a:#3A2E29; --hatch-b:#6E5847; --ground:#9BC75A;
  --lawn-1:#22301A; --lawn-2:#1A2614; --lawn-line:#34482A; --lawn-ink:#C3DB97; --lawn-ink-2:#A5BD7C; --lawn-base:#2E4222; --pillar:#6B5440;
  --g-ghar:#D9667F; --g-bhai:#E2A33C; --g-behn:#EC6AA0; --g-mama:#3BB3AE; --g-rishtedar:#B39BEA; --g-mitra:#98C353; --g-yaar:#8E99EE; --g-crew:#AEA295; --g-text:#170F0D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{accent-color:var(--accent);caret-color:var(--accent-text);scrollbar-color:var(--paper-3) transparent}
::selection{background:var(--sel);color:var(--ink)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
input:disabled,select:disabled{opacity:1;color:var(--ink);cursor:default;-webkit-text-fill-color:var(--ink)}
input[type=checkbox]:disabled{opacity:.55}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.gutter{padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}

/* header band */
.band{background:
  radial-gradient(circle at 12px 7px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 7px 12px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 17px 12px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  radial-gradient(circle at 12px 17px,var(--band-dot) 1.4px,transparent 1.9px) 0 0/24px 24px,
  var(--band);color:var(--band-ink);border-bottom:3px solid var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:16px;max-width:1500px;margin:0 auto}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mono{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px var(--band),inset 0 0 0 4px var(--gold);font:400 19px var(--f-display);color:var(--band-ink);white-space:nowrap}
.mono span{font-size:14px;margin:0 2px;color:var(--gold)}
.brand h1{font:400 30px/1 var(--f-display);color:var(--band-ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand p{margin:5px 0 0;color:var(--band-ink-2);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);color:var(--band-ink);background:var(--band-tab);border-radius:999px;padding:2px 10px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--band-ink-2)}
.status.live i{background:#8BD17C}
.tabs{display:flex;gap:2px;background:var(--band-tab);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--band-ink);min-height:38px}
.tabs button:hover{background:var(--band-tab)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--accent-text)}
.tabs button:focus-visible{outline-color:var(--gold)}

.wrap{padding-block:18px 48px;max-width:1500px;margin:0 auto}
/* summary ledger */
.ledger{display:grid;grid-template-columns:repeat(6,auto);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.ledger>*{background:var(--card);padding:10px 16px;min-width:0;text-align:left;border:0;font:inherit;color:inherit}
.ledger b{display:block;font-size:24px;line-height:1.1;font-weight:700}
.ledger b span{font-size:15px;font-weight:500;color:var(--ink-2)}
.ledger small{color:var(--ink-2);font-size:13px;line-height:1.3;display:block}
.ledger .nights{display:flex;gap:14px}
.ledger button{cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.ledger button:hover{background:var(--paper-2)}
.ledger button.alert b{color:var(--bad)}
.ledger button small{display:flex;align-items:center;gap:4px}
.banner{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hl);border:1px solid var(--hl-line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:15px}
.banner>span:first-child{min-width:0;flex:1 1 320px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;min-height:36px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--paper-2)}
.btn.small{padding:3px 10px;font-size:13.5px;min-height:30px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.itin{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-bottom:14px}
.itin div{padding:8px 16px 8px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.itin div+div{padding-left:16px;border-left:1px solid var(--line)}
.itin b{font-weight:700;color:var(--accent-text);white-space:nowrap}
.itin span{color:var(--ink-2);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px;font-size:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sep{width:1px;height:16px;background:var(--line)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.dot.res{background:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 5px)}
.dot.emp{background:var(--h-empty);border:1px solid var(--h-stroke)}
.sill{width:14px;height:3px;border-radius:2px;background:var(--ground);display:inline-block}

/* site map */
.site{display:grid;grid-template-columns:1fr minmax(220px,.62fr) 1fr;gap:14px}
.zone{background:var(--paper-2);border-radius:16px;padding:12px 12px 14px;min-width:0}
.zone .sign{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 4px 6px}
.zone .sign h2{font:400 21px var(--f-display);color:var(--accent-text)}
.zone .sign small{color:var(--ink-2);font-size:13.5px}
.lane{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.zone.sidelane .lane{grid-template-columns:repeat(2,1fr)}
.villa{background:transparent;border:1px solid transparent;border-radius:12px;padding:6px 4px 8px;text-align:center;transition:background .15s,border-color .15s,transform .15s;position:relative;min-width:0}
.villa:hover{background:var(--card);border-color:var(--line)}
.villa:active{transform:translateY(1px)}
.villa.active{background:var(--card);border-color:var(--accent-text)}
.villa svg{width:100%;max-width:128px;height:auto;display:block;margin:0 auto}
.villa .vl{font-weight:700;font-size:14.5px;margin-top:2px;line-height:1.2}
.villa .vm{font-size:13px;color:var(--ink-2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.villa .flag{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--paper-2)}
.villa .flag.warn{background:var(--warn)}
.hs{stroke:var(--h-stroke)} .h-roof{fill:var(--h-roof)} .h-wall{fill:var(--h-wall)} .h-base{fill:var(--h-base)} .h-empty{fill:var(--h-empty)}
.hatch-a{fill:var(--hatch-a)} .hatch-b{stroke:var(--hatch-b)} .h-ground{fill:var(--ground)} .mg1{fill:var(--mg1)} .mg2{fill:var(--mg2)}
.chowk{border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  background:radial-gradient(circle at 50% 38%,var(--lawn-1) 0,var(--lawn-2) 100%);border:1px solid var(--lawn-line)}
.chowk h2{font:400 24px var(--f-display);color:var(--lawn-ink)}
.chowk p{margin:0;font-size:14px;color:var(--lawn-ink-2)}
.chowk svg{width:150px;max-width:100%;height:auto}
.note{font-size:13.5px;color:var(--ink-3);margin-top:12px}

/* allot board */
.board{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.side header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side header h2{font-size:19px}
.side .hint{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.side .list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.side .list.over{background:var(--hl)}
.field{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:7px 10px;width:100%;min-height:38px}
.hh{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.hh .hhh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14.5px;cursor:pointer;border-radius:6px}
.hh .hhh[draggable=true]{cursor:grab}
.hh .hhh>span{display:flex;align-items:center;gap:7px;min-width:0}
.hh .hhh small{font-weight:500;color:var(--ink-2);white-space:nowrap;font-size:13px}
.hh.sel{border-color:var(--accent-text);box-shadow:0 0 0 1px var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 7px;font-size:13.5px;user-select:none;line-height:1.6;max-width:100%;cursor:pointer}
.chip[draggable=true]{cursor:grab}
.chip:hover{border-color:var(--ink-3)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);background:var(--paper-2);border-radius:4px;padding:0 4px;line-height:1.5}
.chip.sel .tag{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.chip .x{border:0;background:transparent;padding:2px;margin:-2px -6px -2px 0;color:var(--ink-3);display:inline-flex;border-radius:50%}
.chip .x:hover{color:var(--bad);background:var(--paper-2)}
.chip .x .ic{width:13px;height:13px}
.chip.sel .x{color:var(--accent-ink)}
.mainb{min-width:0}
.mainb h2.zh{font:400 21px var(--f-display);margin:20px 0 8px;color:var(--accent-text)}
.mainb h2.zh:first-child{margin-top:0}
.mainb h2.zh small{font:500 14px var(--f-body);color:var(--ink-2);margin-left:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vcard>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}
.vcard>header b{font-size:15.5px}
.vcard>header small{color:var(--ink-2);font-size:13px;font-weight:500}
.slot{padding:8px 12px;border-top:1px dashed var(--line);min-height:56px;transition:background .12s}
.slot:first-of-type{border-top:0}
.slot.over,.placing .slot:not(.reserved):hover{background:var(--hl)}
.placing .slot:not(.reserved){cursor:copy}
.slot .sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font-size:13px;color:var(--ink-2);font-weight:600}
.slot .sh>span:first-child{white-space:nowrap}
.short{color:var(--bad);font-weight:700}
.slot.reserved{background:repeating-linear-gradient(135deg,var(--card) 0 8px,var(--paper-2) 8px 16px)}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;background:var(--badge-bg);color:var(--badge-fg);margin-left:6px;letter-spacing:.4px}
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{min-width:24px;height:16px;padding:0 3px;border-radius:4px;font-size:10.5px;line-height:16px;text-align:center;font-weight:700;background:var(--paper-2);color:var(--ink-3)}
.pip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pip.mat{background:var(--mat-bg);color:var(--mat-fg)}
.pip.bad{background:var(--bad-bg);color:var(--bad-fg)}
.placingbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 8px 8px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;box-shadow:var(--shadow)}

/* guest list */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:var(--paper)}
th{background:var(--paper-2);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
td input[type=text],td select{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:90px}
td input[type=text]:not(:disabled):hover,td select:not(:disabled):hover,td input[type=text]:focus,td select:focus{border-color:var(--line);background:var(--field);outline:none}
td input[type=checkbox]{width:17px;height:17px}
td.c{text-align:center}
tr.new td{background:var(--hl)}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

/* villa drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:20;overflow:auto;
  padding:calc(18px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 18px}
.drawer.open{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer h2{font:400 30px/1.1 var(--f-display);color:var(--accent-text)}

/* Draw by patching: only the parts of the page that changed are touched, so typing,
   focus and scroll position survive and nothing flickers. (morphdom, bundled above.) */
function patch(el, html){
  if (FRESH || !window.morphdom){ el.innerHTML = html; return; }
  const next = el.cloneNode(false); next.innerHTML = html;
  window.morphdom(el, next, {childrenOnly:true,
    onBeforeElUpdated(a, b){
      if (a === document.activeElement && (a.tagName==='SELECT' || (a.tagName==='INPUT' && a.type!=='checkbox'))) return false;
      return !a.isEqualNode(b);

/* =====================================================================
   SUGGEST ROOMS: each family gets the rooms it needs, together in one
   villa where possible, in its side's lane; elders on the ground floor.
   Families marked "shares" join a room of their own family or side.
   ===================================================================== */
const freeRooms = v => v.rooms.filter(r=>!r.hall && !r.reserved && occ(r.id).length===0);
function autoAssign(){
  const todo = S.guests.filter(needsRoom), zids = S.zones.map(z=>z.id);
  const rank = p => p.group==='ghar' ? 0 : p.elder ? 1 : p.group==='crew' ? 2 : 3 + GROUPS.findIndex(g=>g.id===p.group);
  todo.sort((a,b)=>rank(a)-rank(b) || a.family.localeCompare(b.family) || b.rn-a.rn || a.ord-b.ord);
  let left = 0;
  for (const p of todo){
    const zones = [...(p.elder ? [zids[0]] : []), ...grp(p.group).zones, ...zids].filter((z,i,a)=>zids.includes(z) && a.indexOf(z)===i);
    const ordered = zones.flatMap(z=>S.villas.filter(v=>v.zone===z));
    const famIn = v => v.rooms.some(r=>occ(r.id).some(g=>g!==p && famKey(g)!=='__own' && g.family===p.family));
    const grpIn = v => v.rooms.some(r=>occ(r.id).some(g=>g!==p && g.group===p.group));
    if (p.rn===0 && !p.rooms.length){
      const fits = r => !r.hall && !r.reserved && occ(r.id).length && NIGHTS.every((_,n)=>loadN(r.id,n) + (p.nights[n]?beds(p):0) <= cap(r)+1);
      const pool = ordered.filter(v=>famIn(v)).concat(ordered.filter(v=>!famIn(v) && grpIn(v)));
      const r = pool.flatMap(v=>v.rooms).find(fits);
      if (r){ p.rooms = [r.id]; continue; }
    }
    let need = needRooms(p) - p.rooms.length;
    const home = p.rooms.length ? villaOf(p.rooms[0]) : null;
    const score = v => famIn(v) ? 3 : grpIn(v) ? 2 : v.rooms.some(r=>occ(r.id).length) ? 0 : 1;
    const cands = (home ? [home] : ordered).filter(v=>{ const fr = freeRooms(v); return fr.length >= need && (!p.elder || fr.some(r=>r.ground)); });
    let target = null;
    for (const z of zones){ const c = cands.filter(v=>v.zone===z || v===home).sort((a,b)=>score(b)-score(a)); if (c.length){ target = c[0]; break; } }
    const take = rs => { while (need > 0 && rs.length){ const r = rs.shift(); p.rooms.push(r.id); need--; } };
    if (target){ const fr = freeRooms(target).sort((a,b)=>p.elder ? b.ground-a.ground : a.ground-b.ground); take(fr); }
    else for (const v of ordered){ take(freeRooms(v)); if (!need) break; }
    if (need > 0) left++;
  }
  return left;
}

/* =====================================================================
   IMPORT: CSV or Excel. Understands this planner's own columns and the
   family sheet's columns (Family Name, Count bade, Count Chote, Coming
   from, Room dena, Room Count, Relation, Mama Paksh …).
   ===================================================================== */
const STOP = new Set('ji didi bhuaji bhua mamaji mama mami mamiji masi masiji mausi kaka kakaji bhai bhaiya dadaji dadi dada chacha chachi nana nani sir dr and the dost papa mummy'.split(' '));
function rowsToParties(rows){
  const pick = (o, ...ks) => { for (const k of ks){ const v = o[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return v; } return ''; };
  const yes = v => /^(1|y|yes|true|x|haan|✓)$/i.test(String(v ?? '').trim());
  const nameOf = r => String(pick(r,'name','family name','guest','party')).trim();
  const fromOf = r => String(pick(r,'from','coming from','location','city')).trim();
  const locs = new Set(rows.flatMap(r=>fromOf(r).toLowerCase().split(/[^a-z]+/)).filter(Boolean));
  const tally = {};
  rows.forEach(r=>{ new Set(nameOf(r).split(/\s+/).slice(1).map(t=>t.toLowerCase().replace(/[^a-z]/g,''))).forEach(t=>{ if (t.length>2 && !STOP.has(t) && !locs.has(t)) tally[t] = (tally[t]||0)+1; }); });
  const clan = n => { const t = n.split(/\s+/).slice(1).map(x=>x.replace(/[^A-Za-z]/g,'')).filter(x=>tally[x.toLowerCase()]>=2); const h = t[t.length-1]; return h ? h[0].toUpperCase()+h.slice(1).toLowerCase() : ''; };
  let ord = Date.now();
  return rows.map(r=>{
    const name = nameOf(r); if (!name) return null;
    const rel = String(pick(r,'relation')).trim(), rl = rel.toLowerCase(), gtxt = String(pick(r,'group','side')).trim().toLowerCase();
    let group = GROUPS.find(g=>g.id===gtxt || g.name.toLowerCase()===gtxt)?.id;
    if (!group) group = /mama/.test(rl) ? 'mama' : /bhai/.test(rl) ? 'bhai' : /behn|beti|bhatij|bhua|didi|masi/.test(rl) ? 'behn' : /pandit/.test(rl) ? 'crew'
      : /friend|dost/.test(rl) ? 'mitra' : /relative/.test(rl) ? 'rishtedar' : yes(r['mama paksh']) ? 'mama' : yes(r['behen betiya']) ? 'behn'
      : yes(r['close relatives']) ? 'bhai' : /dost|friend/i.test(name) ? 'mitra' : 'rishtedar';
    const adults = int0(pick(r,'adults','count bade'), 0), kids = int0(pick(r,'kids','count chote'), 0);
    const hotel = String(pick(r,'hotel')).trim();
    const stayTxt = String(pick(r,'stay')).trim().toLowerCase();
    const stay = /hotel/.test(stayTxt) ? 'hotel' : /home|own|none|no/.test(stayTxt) ? 'home' : /villa|room|yes/.test(stayTxt) ? 'villa'
      : hotel ? 'hotel' : yes(r['room dena']) ? 'villa' : (r['room dena'] !== undefined ? 'home' : 'villa');
    const rnRaw = String(pick(r,'rooms_needed','rooms needed','room count')).trim();
    const adjust = /adjust/i.test(rnRaw);
    const rn = adjust ? 0 : rnRaw ? int0(rnRaw, 1) : (stay==='villa' && r['room count'] !== undefined ? 0 : Math.max(1, Math.floor(adults/2)));
    const nt = String(pick(r,'nights')).toLowerCase();
    const notes = [String(pick(r,'note','notes')).trim(), adjust ? 'Rooms: adjust with others' : '', hotel ? `Hotel room ${hotel}` : ''].filter(Boolean);
    const rooms = String(pick(r,'rooms','room_id')).toUpperCase().split(/[\s,;]+/).filter(x=>validRoom(x) && roomById(x));
    return {id:uid(), name, family:String(pick(r,'family','household')).trim() || clan(name) || name, group, relation:rel, adults, kids,
      from:fromOf(r), stay, rn, rooms, nights: nt ? [/27/.test(nt), /28/.test(nt), /(^|\D)1(\D|$)|mar/.test(nt)] : [false,true,true],
      elder: yes(pick(r,'elder')) || /\b(dadi|dadaji|dada|nana|nani|nanaji|naniji)\b/i.test(name),
      phone:String(pick(r,'phone','mobile')).trim(), note:notes.join('. '), ord:ord++};
  }).filter(Boolean);
}
function tableToRows(aoa){
  const norm = v => String(v ?? '').trim().toLowerCase();
  const h = aoa.findIndex(r=>r && r.some(c=>['name','family name'].includes(norm(c))));
  if (h < 0) return [];
  const head = aoa[h].map(norm);
  return aoa.slice(h+1).filter(r=>r && r.some(c=>c!==null && String(c).trim()!=='')).map(r=>Object.fromEntries(head.map((k,i)=>[k, r[i] ?? null]).filter(([k])=>k)));
}

async function importFile(file){

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function warnings(){
  if (WC) return WC;
  const W = [];
  for (const v of S.villas) for (const r of v.rooms){
    const o = occ(r.id); if (!o.length) continue;
    if (r.reserved) W.push({lvl:'bad', v:v.id, t:`${v.label} · ${r.label} is held for "${r.reserved}" but has guests`});
    const s = shortBy(r);
    if (s > 0) W.push({lvl:'bad', v:v.id, t:`${v.label} · ${r.label} sleeps ${cap(r)} but needs ${fmt(Math.max(...NIGHTS.map((_,n)=>loadN(r.id,n))))} beds. Add ${s} ${s===1?'mattress':'mattresses'}.`});
    o.filter(p=>p.elder && !r.ground).forEach(p=>W.push({lvl:'warn', v:v.id, t:`${p.name} has elders but is upstairs in ${v.label} · ${r.label}`}));
  }
  for (const p of S.guests){
    if (!p.rooms.length) continue;
    if (p.stay!=='villa') W.push({lvl:'warn', v:villaOf(p.rooms[0]).id, t:`${p.name} is marked "${STAYS.find(s=>s.id===p.stay).name}" but has a villa room`});
    else if (p.rooms.length < needRooms(p)) W.push({lvl:'warn', v:villaOf(p.rooms[0]).id, t:`${p.name} has ${p.rooms.length} of the ${needRooms(p)} rooms they need`});
    const vs = [...new Set(p.rooms.map(r=>r.slice(0,3)))];
    if (vs.length > 1) W.push({lvl:'info', v:vs[0], t:`${p.name} is split across ${vs.map(id=>villaById(id).label).join(' & ')}`});
  }
  const nohc = S.guests.filter(p=>p.stay==='villa' && !people(p));
  if (nohc.length){ const f = nohc.find(p=>p.rooms.length); W.push({lvl:'info', v:f ? f.rooms[0].slice(0,3) : '', t:`${nohc.length} families staying in villas have no guest count yet: ${nohc.slice(0,6).map(p=>p.name).join(', ')}${nohc.length>6?'…':''}`}); }
  const o = ['bad','warn','info'];
  return WC = W.sort((a,b)=>o.indexOf(a.lvl)-o.indexOf(b.lvl));
}

const shortRoom = r => roomName(r).replace('Villa ','V').replace(' · Room ',' ').replace(' · Hall',' Hall');
function guestsHTML(){
  const q = UI.q.trim().toLowerCase(), F = UI.filters;
  const match = g => (!F.side.size || F.side.has(g.group)) && (!F.family.size || F.family.has(famKey(g))) && (!F.city.size || F.city.has(cityKey(g)))
    && (UI.sf==='all' || g.stay===UI.sf) && statusIs(g, UI.status) && (!q || (g.name+' '+g.family+' '+g.from+' '+g.relation).toLowerCase().includes(q));
  const f = SORTS[UI.sort.key] || SORTS.side, dir = UI.sort.dir;
  const sorter = (a,b)=> dir*cmpVal(f(a), f(b)) || SORTS.side(a)-SORTS.side(b) || cmpVal(SORTS.family(a), SORTS.family(b)) || a.ord-b.ord;
  const recent = UI.recent.map(guest).filter(Boolean).filter(match);
  const list = recent.concat(S.guests.filter(g=>!UI.recent.includes(g.id) && match(g)).sort(sorter)), d = dis();

/* Before a bulk change, keep one automatic backup per kind of change. */
function autoBackup(what){
  if (!UI.canWrite || !S.guests.some(g=>g.rooms.length)) return;
  const id = 'auto-' + what.toLowerCase().replace(/[^a-z]+/g, '-');
  const doc = {name:'Auto: before ' + what, at:new Date().toISOString(), families:S.guests.length, placed:S.guests.filter(g=>g.rooms.length).length,
    guests:Object.fromEntries(S.guests.map(g=>[g.id, gdoc(g)])), villas:Object.fromEntries(S.villas.map(v=>[v.id, vdoc(v)])), zones:S.zones.map(z=>({...z}))};
  if (UI.mode==='shared') DB.doc('backups/' + id).set(doc).catch(()=>{});
  else try{ const l = JSON.parse(localStorage.getItem(BK_LS) || '[]').filter(x=>x.id!==id); localStorage.setItem(BK_LS, JSON.stringify([{id, ...doc}, ...l])); }catch(e){}
}
async function openBackups(){
  SHEET_FROM = document.activeElement; UI.sheet = 'backups'; UI.backups = null; render(); $('#bk-name')?.focus();
  try{ UI.backups = await listBackups(); }catch(e){ UI.backups = []; toast('Backups could not be loaded. Check your connection.'); }
  render();
}
async function saveBackup(name){
  const b = {id:'b' + Date.now().toString(36), name:name || 'Backup', at:new Date().toISOString(), families:S.guests.length, placed:S.guests.filter(g=>g.rooms.length).length,
    guests:Object.fromEntries(S.guests.map(g=>[g.id, gdoc(g)])), villas:Object.fromEntries(S.villas.map(v=>[v.id, vdoc(v)])), zones:S.zones.map(z=>({...z}))};
  UI.bkBusy = true; render();
  try{
    if (UI.mode==='shared'){ const {id, ...doc} = b; await DB.doc('backups/' + id).set(doc); }
    else localStorage.setItem(BK_LS, JSON.stringify([b, ...(UI.backups||[])]));
    UI.backups = [b, ...(UI.backups||[])]; toast(`Backup "${b.name}" saved`);
  }catch(e){ toast('The backup could not be saved. Try again.'); }
  UI.bkBusy = false; render();
}
async function deleteBackup(id){
  const b = (UI.backups||[]).find(x=>x.id===id); if (!b) return;
  if (!await ask('Delete this backup?', `"${b.name}" is removed for everyone. The current plan is not changed.`, [{label:'Delete backup', value:true, cls:'danger'}])) return;
  try{
    if (UI.mode==='shared') await DB.doc('backups/' + id).delete();
    UI.backups = UI.backups.filter(x=>x.id!==id);
    if (UI.mode!=='shared') localStorage.setItem(BK_LS, JSON.stringify(UI.backups));
  }catch(e){ toast('That backup could not be deleted. Try again.'); }
  render();
}
function restoreBackup(id){
  const b = (UI.backups||[]).find(x=>x.id===id); if (!b || !UI.canWrite) return;
  checkpoint();
  const bg = b.guests || {}, bv = b.villas || {}; let missing = 0;
  for (const g of S.guests){ const x = bg[g.id];
    if (x){ const n = normGuest(g.id, x); g.rooms = n.rooms.filter(r=>roomById(r)); g.stay = n.stay; g.rn = n.rn; } else g.rooms = []; }
  for (const id of Object.keys(bg)) if (!guest(id)) missing++;
  for (const v of S.villas){ const x = bv[v.id]; if (!x || !Array.isArray(x.rooms)) continue;
    v.rooms.forEach((r,i)=>{ const y = x.rooms[i]; if (!y) return; if ('mats' in y) r.mats = int0(y.mats, r.mats); if ('beds' in y) r.beds = int0(y.beds, r.beds); if ('reserved' in y) r.reserved = String(y.reserved||''); }); }
  UI.sheet = null; commit();
  undoToast(`Rooms restored from "${b.name}"${missing?`. ${missing} families in it are no longer on the list.`:''}`);
}

function placeSelection(sel, roomId){
  if (!UI.canWrite) return;
  const r = roomById(roomId), p = guest(sel.id); if (!p) return;
  if (!r || r.reserved){ toast('That room is held for something else'); return; }
  const v = villaOf(roomId);
  if (sel.from){ p.rooms = [...new Set(p.rooms.map(x=>x===sel.from ? roomId : x))]; toast(`${p.name} moved to ${v.label}, ${r.label}`); }
  else if (p.rooms.includes(roomId)) toast(`${p.name} is already in ${v.label}, ${r.label}`);
  else {
    p.rooms.push(roomId); p.stay = 'villa';
    let need = needRooms(p) - p.rooms.length;
    for (const fr of freeRooms(v)) if (need > 0 && !p.rooms.includes(fr.id)){ p.rooms.push(fr.id); need--; }
    toast(need > 0 ? `${p.name} is in ${v.label}; ${need} more ${need===1?'room':'rooms'} needed` : `${p.name} is in ${v.label}, ${p.rooms.filter(x=>x.startsWith(v.id)).map(x=>roomById(x).label).join(' & ')}`);
  }
  UI.sel = null; commit();
}
function moveVilla(id, zid, beforeId){
  const v = villaById(id); if (!v || !S.zones.some(z=>z.id===zid) || id===beforeId) return;
  const lane = S.villas.filter(x=>x.zone===zid && x.id!==id), i = beforeId ? lane.findIndex(x=>x.id===beforeId) : -1;
  if (i >= 0) lane.splice(i, 0, v); else lane.push(v);
  v.zone = zid; lane.forEach((x,k)=>{ x.ord = k+1; }); commit();
}
function addVilla(zid){
  const used = new Set([...S.villas.map(v=>v.id), ...STORE.v.keys(), ...OVER.v.keys(), ...GONE]);
  let n = 1; while (n < 100 && used.has('V' + String(n).padStart(2,'0'))) n++;
  if (n > 99){ toast('The plan can hold up to 99 villas'); return; }
  const v = newVilla(n, zid); v.ord = Math.max(0, ...S.villas.filter(x=>x.zone===zid).map(x=>x.ord)) + 1;
  S.villas.push(v); commit(); toast(`${v.label} added to ${zone(zid).name}`);
}
const csvCell = s => /[",\n]/.test(String(s)) ? `"${String(s).replace(/"/g,'""')}"` : String(s);
function exportCSV(){
  const rows = [['name','family','group','relation','adults','kids','from','stay','rooms_needed','rooms','villa_rooms','nights','elder','phone','note']];
  for (const g of S.guests) rows.push([g.name,g.family,grp(g.group).name,g.relation,g.adults,g.kids,g.from,g.stay,g.rn,g.rooms.join(' '),g.rooms.map(roomName).join('; '),
    NIGHTS.filter((_,n)=>g.nights[n]).map(n=>n.short).join(' '),g.elder?'yes':'',g.phone,g.note]);
  saveFile('villa-allotment.csv', rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}
function templateCSV(){
  saveFile('guest-list-template.csv', ['name,family,group,relation,adults,kids,from,stay,rooms_needed,nights,phone,note',
    'Vinod Pansari,Pansari,Bhai-bandhu,Bhai,4,2,Jaipur,villa,2,28 1,,',
    'Pankaj Mamaji,,Mama paksh,Mama,2,2,Bhopal,villa,1,28 1,,',
    'Rinki Didi,,Behn-Beti,Behn/beti,2,0,Jaipur,villa,0,28 1,,Shares with Pinki Didi',
    'Ravi Bajaj,Bajaj,Friends,Friend,2,0,Surat,home,0,,,'].join('\n'));
}
function addFamily(){
  const f = UI.form;
  if (!f.name.trim()){ f.err = 'Add a name first.'; render(); $('#af-name')?.focus(); return; }
  const p = normGuest(uid(), {name:f.name.trim(), family:f.family.trim() || f.name.trim(), group:f.group, adults:f.adults, kids:f.kids, from:f.from.trim(), stay:f.stay, rn:f.rn, ord:Date.now()});
  p.elder = /\b(dadi|dadaji|dada|nana|nani)\b/i.test(p.name);
  S.guests.push(p); UI.recent.unshift(p.id);
  UI.form = {...f, name:'', family:'', adults:2, kids:0, rn:1, rnTouched:false, err:''};
  commit(); toast(`Added ${p.name}`);
  const n = $('#af-name'); if (n){ n.value = ''; n.focus(); } const fm = $('#af-family'); if (fm) fm.value = '';
}
function setTab(t){
  if (!['map','allot','guests','cards'].includes(t)) t = 'map';
  if (t === UI.tab) return;
  const go = () => { UI.tab = t; UI.sel = null; UI.ms = null; UI.q = ''; FRESH = true; render(); FRESH = false; window.scrollTo({top:0}); };
  if (t!=='guests' && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){ const vt = document.startViewTransition(go); [vt.ready, vt.finished, vt.updateCallbackDone].forEach(x=>x && x.catch(()=>{})); } else go();
}

/* ---- events ---- */
let qTimer = 0;
document.addEventListener('submit', e=>{
  if (e.target.id==='addform'){ e.preventDefault(); if (UI.canWrite) addFamily(); }
  if (e.target.id==='bkform'){ e.preventDefault(); const i = $('#bk-name'); if (UI.canWrite && !UI.bkBusy){ saveBackup(i.value.trim()); i.value = ''; } }
});
document.addEventListener('click', e=>{
  const t = e.target;
  if (t.closest('#modal') || t.closest('#toast')) return;
  if (UI.ms && !t.closest('.ms')){ UI.ms = null; render(); }
  if (t.id==='sheet'){ closeSheet(); return; }
  const tab = t.closest('[data-tab]'); if (tab){ location.hash = tab.dataset.tab; setTab(tab.dataset.tab); return; }
  const srt = t.closest('[data-sort]'); if (srt){ const k = srt.dataset.sort; UI.sort = UI.sort.key===k ? {key:k, dir:-UI.sort.dir} : {key:k, dir:1}; UI.recent = []; render(); return; }
  const stt = t.closest('[data-status]'); if (stt){ UI.status = stt.dataset.status; render(); return; }
  const mst = t.closest('[data-ms-toggle]'); if (mst){ UI.ms = UI.ms===mst.dataset.msToggle ? null : mst.dataset.msToggle; UI.msq = ''; render(); const q = UI.ms && document.getElementById('msq-' + UI.ms); if (q) q.focus(); return; }
  const msc = t.closest('[data-ms-clear]'); if (msc){ UI.filters[msc.dataset.msClear].clear(); render(); return; }
  if (t.closest('[data-ms-close]')){ const k = UI.ms; UI.ms = null; render(); document.getElementById('msb-' + k)?.focus(); return; }
  const fs = t.closest('[data-fs]'); if (fs){ const k = fs.dataset.fs, f = UI.form; f[k] = Math.max(0, Math.min(99, f[k] + (+fs.dataset.d)));
    if (k!=='rn' && !f.rnTouched) f.rn = f.stay==='villa' ? Math.max(1, Math.floor(f.adults/2)) : 0; if (k==='rn') f.rnTouched = true; render(); return; }
  const mat = t.closest('[data-mat]'); if (mat){ const r = roomById(mat.dataset.mat); if (r){ r.mats = Math.max(0, Math.min(20, r.mats + (+mat.dataset.d))); commit(); } return; }
  const un = t.closest('[data-unassign]'); if (un){ const p = guest(un.dataset.unassign); if (p){ p.rooms = p.rooms.filter(r=>r!==un.dataset.r); commit(); } return; }
  const del = t.closest('[data-del]'); if (del){ const g = guest(del.dataset.del); if (g){ checkpoint(); S.guests = S.guests.filter(x=>x.id!==g.id); commit(); undoToast(`Deleted ${g.name}`); } return; }
  const av = t.closest('[data-addvilla]'); if (av){ addVilla(av.dataset.addvilla); return; }
  const rv = t.closest('[data-rmvilla]'); if (rv){ const v = villaById(rv.dataset.rmvilla); if (v && !v.rooms.some(r=>occ(r.id).length)){ checkpoint(); S.villas = S.villas.filter(x=>x.id!==v.id); commit(); undoToast(`${v.label} removed`); } return; }
  const rz = t.closest('[data-rmzone]'); if (rz){ const z = zone(rz.dataset.rmzone); if (S.zones.length > 1 && !S.villas.some(v=>v.zone===z.id)){ checkpoint(); S.zones = S.zones.filter(x=>x.id!==z.id); commit(); undoToast(`${z.name} removed`); } return; }
  const bkr = t.closest('[data-bk-restore]'); if (bkr){ restoreBackup(bkr.dataset.bkRestore); return; }
  const bkd = t.closest('[data-bk-del]'); if (bkd){ deleteBackup(bkd.dataset.bkDel); return; }
  const act = t.closest('[data-act]');
  if (act){ const a = act.dataset.act;
    if (a==='close'){ UI.villa = null; render(); backFocus(); }
    if (a==='toggle-warns'){ UI.showWarns = !UI.showWarns; render(); }
    if (a==='auto'){ autoBackup('Suggest rooms'); checkpoint(); const left = autoAssign(); commit(); undoToast(left ? `Rooms suggested. ${left} families did not fit.` : 'Rooms suggested for everyone. Check them over.'); }
    if (a==='clear'){ autoBackup('Clear all rooms'); checkpoint(); S.guests.forEach(g=>g.rooms=[]); commit(); undoToast('All rooms cleared'); }
    if (a==='cancel-sel'){ UI.sel = null; render(); }
    if (a==='reset-filters'){ UI.q = ''; UI.sf = 'all'; UI.status = 'all'; Object.values(UI.filters).forEach(s=>s.clear()); render(); const q = $('#q-guests'); if (q) q.value = ''; }
    if (a==='edit-layout'){ UI.layoutEdit = !UI.layoutEdit; UI.villa = null; render(); }
    if (a==='add-lane'){ S.zones.push({id:'z' + Date.now().toString(36), name:'New lane', sub:''}); commit(); const i = document.getElementById('zn-' + S.zones[S.zones.length-1].id); if (i){ i.focus(); i.select(); } }
    if (a==='backups') openBackups();
    if (a==='close-sheet') closeSheet();
    if (a==='template') templateCSV();
    if (a==='import-csv') $('#fileCsv').click();
    if (a==='export-csv') exportCSV();
    if (a==='save-cards') saveFile('villa-door-cards.html', printablePage());
    if (a==='print') window.print();
    return; }
  const open = t.closest('[data-open]'); if (open && open.dataset.open){ FROM = open.id || null; UI.villa = open.dataset.open; render(); $('#drawer [data-act=close]')?.focus({preventScroll:true}); return; }
  if (!UI.canWrite) return;
  const slotEl = t.closest('.slot[data-drop]'); if (slotEl && UI.sel && !t.closest('.chip')){ placeSelection(UI.sel, slotEl.dataset.drop); return; }
  const chip = t.closest('[data-g]'); if (chip && !t.closest('.stepper')){ const id = chip.dataset.g, from = chip.dataset.from || '';
    UI.sel = UI.sel && UI.sel.id===id && UI.sel.from===from ? null : {id, from}; render(); return; }
});
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z' && UNDO && !(e.target.matches && e.target.matches('input,textarea,select'))){ e.preventDefault(); undo(); return; }
  if (e.key==='Tab' && UI.sheet && $('#modal').hidden){ const f = [...$('#sheetbox').querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled && x.offsetParent);
    if (f.length){ const first = f[0], last = f[f.length-1]; if (!$('#sheetbox').contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } } }
  if (e.key==='Escape' && $('#modal').hidden){
    if (UI.ms){ const k = UI.ms; UI.ms = null; render(); document.getElementById('msb-' + k)?.focus(); return; }
    if (UI.sheet){ closeSheet(); return; }
    const had = UI.villa; UI.sel = null; UI.villa = null; render(); if (had) backFocus(); return; }
  if ((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role=button][tabindex="0"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.k==='q'){ UI.q = t.value; clearTimeout(qTimer); qTimer = setTimeout(render, 140); return; }
  if ('msq' in t.dataset){ UI.msq = t.value; render(); return; }
  if (t.dataset.f){ UI.form[t.dataset.f] = t.value; if (t.dataset.f==='name') UI.form.err = ''; }
});
document.addEventListener('change', e=>{
  const t = e.target, d = t.dataset;
  if ('msv' in d){ const s = UI.filters[d.msk]; if (t.checked) s.add(d.msv); else s.delete(d.msv); render(); return; }
  if (d.k && d.k!=='q'){ UI[d.k] = t.value; render(); return; }
  if (d.f){ UI.form[d.f] = t.value; if (d.f==='stay' && !UI.form.rnTouched){ UI.form.rn = t.value==='villa' ? Math.max(1, Math.floor(UI.form.adults/2)) : 0; render(); } return; }
  if (d.ge){ const g = guest(d.id); if (!g) return;
    if (d.ge==='night') g.nights[+d.n] = t.checked;
    else if (d.ge==='elder') g.elder = t.checked;
    else if (['adults','kids','rn'].includes(d.ge)){ g[d.ge] = int0(t.value, g[d.ge]); t.value = g[d.ge]; }
    else if (d.ge==='name'){ const old = g.name; g.name = t.value.trim() || g.name; if (g.family===old) g.family = g.name; t.value = g.name; }
    else if (d.ge==='family') g.family = t.value.trim() || g.name;
    else g[d.ge] = t.value.trim();
    if (d.ge==='stay' && g.stay!=='villa' && g.rooms.length){ checkpoint(); g.rooms = []; commit(); undoToast(`${g.name}'s villa rooms were released`); return; }
    commit(); return; }
  if (d.addroom){ const g = guest(d.addroom), v = t.value; t.value = ''; t.blur(); if (g && v && !g.rooms.includes(v)){ g.rooms.push(v); g.stay = 'villa'; commit(); } return; }
  if (d.vmove){ moveVilla(d.vmove, t.value); return; }
  if (d.ze){ const z = S.zones.find(x=>x.id===d.z); if (z){ z[d.ze] = t.value.trim() || (d.ze==='name' ? z.name : ''); t.value = z[d.ze]; commit(); } return; }
  if (d.ve){ const v = villaById(UI.villa); if (!v) return; v[d.ve] = t.value.trim() || (d.ve==='note' ? '' : v[d.ve]); t.value = v[d.ve]; commit(); return; }
  if (d.re){ const r = roomById(d.r); if (!r) return; r[d.re] = d.re==='ground' ? t.checked : d.re==='beds' ? int0(t.value, r.beds) : t.value.trim(); commit(); return; }
  if (d.addto && t.value){ const v = t.value; t.value = ''; t.blur(); placeSelection({id:v, from:''}, d.addto); return; }
});
['pointerdown','focusin'].forEach(ev=>document.addEventListener(ev, e=>{ const s = e.target.closest && e.target.closest('select.addroom'); if (s) fillRooms(s); }, true));
document.addEventListener('dragstart', e=>{
  if (!UI.canWrite || !e.target.closest) return;
  const vt = e.target.closest('.vtile[data-v]');
  if (vt){ e.dataTransfer.setData('text/plain', JSON.stringify({villa:vt.dataset.v})); e.dataTransfer.effectAllowed = 'move'; return; }
  const c = e.target.closest('[data-g]'); if (!c) return;
  e.dataTransfer.setData('text/plain', JSON.stringify({id:c.dataset.g, from:c.dataset.from||''}));
  e.dataTransfer.effectAllowed = 'move';
});
const dropZone = t => t.closest && (t.closest('[data-drop]') || t.closest('[data-lane]'));
document.addEventListener('dragover', e=>{ const z = dropZone(e.target); if (z && UI.canWrite){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e=>{ const z = dropZone(e.target); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e=>{
  const z = dropZone(e.target); if (!z || !UI.canWrite) return; e.preventDefault(); z.classList.remove('over');
  let sel; try{ sel = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
  if (z.dataset.lane){ if (sel.villa){ const before = e.target.closest('.vtile[data-v]'); moveVilla(sel.villa, z.dataset.lane, before ? before.dataset.v : null); } return; }
  if (!sel.id) return;
  if (z.dataset.drop==='unassign'){ const p = guest(sel.id); if (p){ p.rooms = sel.from ? p.rooms.filter(r=>r!==sel.from) : []; commit(); } return; }
  placeSelection(sel, z.dataset.drop);
});
$('#fileCsv').addEventListener('change', e=>{ const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
window.addEventListener('hashchange', ()=>setTab(location.hash.slice(1)));

/* =====================================================================
   BOOT: the shared database when opened as a published page,
   this browser's storage when opened as a file
   ===================================================================== */
function startLocal(note){ UI.mode = 'local'; UI.note = note || ''; UI.loaded = true; loadLocal(); rebuild(); FRESH = true; render(); FRESH = false; }
async function boot(){
  document.documentElement.lang = 'en';
  UI.tab = ['map','allot','guests','cards'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'map';
  rebuild(); render(); FRESH = false;
  if (!IN_VIEWER){ startLocal(); return; }
  let db = null, user = null;
  try{ [db, user, DL] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); }catch(e){}
  UI.canDL = !!DL;
  if (!db){ startLocal('Sign in to see the family’s shared plan. Changes made here stay in this browser only.'); return; }
  DB = db; UI.mode = 'shared';
  try{ const w = user ? await user.can('data.write') : null; UI.canWrite = w !== false; }catch(e){}
  const got = {g:false, v:false, c:false};
  const timer = setTimeout(()=>{ if (!UI.loaded){ UI.note = 'The shared plan can’t be reached right now. It appears as soon as the connection is back.'; render(); } }, 10000);
  const ready = (k, snap) => { if (!snap.metadata.fromCache) got[k] = true;
    if (got.g && got.v && got.c && !UI.loaded){ UI.loaded = true; clearTimeout(timer); if (UI.note.startsWith('The shared plan')) UI.note = ''; } };
  const fail = e => { clearTimeout(timer); UI.loaded = true; UI.note = e && e.code==='revoked' ? 'This plan is no longer shared with you.' : 'The live link to the shared plan dropped. Reload the page to reconnect.'; render(); };
  const sub = (name, k) => DB.collection(name).onSnapshot(snap=>{ STORE[k] = new Map(snap.docs.map(d=>[d.id, d.data()])); ready(k, snap); refreshFromStore(); }, fail);
  sub('guests', 'g'); sub('villas', 'v'); sub('config', 'c');
}
boot();
</script>
